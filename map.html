<!doctype html>
<!-- Temporary: the prototype's basemap on its own, no routes or markers, for taking screenshots into Figma. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripUp map</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e7eef6; font-family: -apple-system, system-ui, sans-serif; }
      #map { position: absolute; inset: 0; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 1;
        padding: 6px 10px; border-radius: 8px;
        background: rgb(14 26 54 / 0.75); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums;
        user-select: text;
      }
      body.clean #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="hud"></div>
    <script type="module" src="/src/mapOnly.ts"></script>
  </body>
</html>
