<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kept out of search results, on every domain this is served on. netlify.toml sends the same as a header. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TripUp</title>
    <meta name="description" content="Plan the trip. Share the moments." />
    <meta property="og:title" content="TripUp" />
    <meta property="og:description" content="Plan the trip. Share the moments." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TripUp. Plan the trip. Share the moments." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripUp" />
    <meta name="twitter:description" content="Plan the trip. Share the moments." />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="TripUp. Plan the trip. Share the moments." />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
        <feImage href="/assets/glass/lens-x.svg" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="x" />
        <feImage href="/assets/glass/lens-y.svg" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="y" />
        <feBlend in="x" in2="y" mode="screen" result="lens" />
        <feDisplacementMap in="SourceGraphic" in2="lens" scale="0.14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
